# appId inchangé depuis l'ancien nom (FiveM Pack Manager) : il identifie l'installation pour les mises à jour
# (clé de désinstallation, épinglages).
appId: fr.fivem.packmanager
productName: Reflect FiveM
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - '!packs/**'
  - '!node_modules/7zip-bin/{mac,linux}/**'
  - '!node_modules/7zip-bin/win/{ia32,arm64}/**'
# Liens « fivem-pack-manager://pack/<id> » du site (« Installer via l'app »), enregistrés par l'installateur. Le
# schéma garde l'ancien nom : le site l'utilise pour toutes les versions installées.
protocols:
  - name: Reflect FiveM
    schemes: [fivem-pack-manager]
asarUnpack:
  - node_modules/7zip-bin/**
  - node_modules/node-unrar-js/**/*.wasm
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: resources/icon.png
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Installateur en français ou en anglais selon la langue de Windows (français pour les autres langues, comme
  # l'application). Ajouter une langue à l'application : l'ajouter aussi ici (code NSIS, ex. de_DE).
  multiLanguageInstaller: true
  installerLanguages: [fr_FR, en_US]
  language: '1036'
  artifactName: Reflect-FiveM-Setup-${version}.${ext}
portable:
  artifactName: Reflect-FiveM-Portable-${version}.${ext}
# Génère resources/app-update.yml, lu par electron-updater. Les fichiers sont publiés à la main dans
# l'administration du site (Versions de l'app), après signature (scripts/sign-release.mjs).
publish:
  provider: generic
  url: https://reflect-fivem.com/api/app/updates
